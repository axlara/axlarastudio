<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AIVRSE Hub | AI WebXR Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js  "></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js  "></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-text-component@0.5.0/dist/aframe-text-component.min.js  "></script>

  <style>
    html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family: 'Segoe UI', sans-serif; }
    .topbar { position: fixed; top: 15px; left: 15px; z-index: 10; display:flex; gap:12px; align-items:center; background: rgba(10, 20, 25, 0.75); border: 1px solid rgba(0, 255, 247, 0.3); border-radius: 12px; padding: 10px 16px; color: #E8FFFF; font-size: 13px; backdrop-filter: blur(12px); }
    .btn { border: 1px solid rgba(0, 255, 247, 0.2); background: rgba(255, 255, 255, 0.05); color: #00fff7; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; }
    .btn:hover { background: rgba(0, 255, 247, 0.15); border-color: #00fff7; }

    .footer-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(159, 236, 236, 0.6);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      pointer-events: none;
      animation: pulse 3s infinite ease-in-out;
      z-index: 10;
      text-align: center;
      width: 100%;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

    /* =========================
       SPLASH / CAPA DE ENTRADA
       ========================= */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #05070a;
    }
    .splash::before{
      content:"";
      position:absolute; inset:0;
      background: url("imagens/panorama_estudio_360.jpg") center/cover no-repeat;
      filter: saturate(0.92) contrast(1.06);
      opacity: 1;
    }
    .splash::after{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.25), rgba(0,0,0,0.86));
    }
    .splash-card{
      position: relative;
      width: min(920px, 88vw);
      padding: 34px 34px 30px;
      border-radius: 18px;
      background: rgba(5, 10, 14, 0.58);
      border: 1px solid rgba(0,255,247,0.18);
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
      backdrop-filter: blur(14px);
      color: #E8FFFF;
      text-align: left;
    }
    .splash-kicker{
      color: rgba(0,255,247,0.85);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .splash-title{
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
      margin: 0 0 10px;
      font-weight: 700;
    }
    .splash-sub{
      margin: 0 0 18px;
      font-size: 15px;
      line-height: 1.45;
      color: rgba(232,255,255,0.86);
      max-width: 58ch;
    }
    .splash-actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-top: 6px;
    }
    .splash-btn{
      border: 1px solid rgba(0, 255, 247, 0.25);
      background: rgba(0, 255, 247, 0.10);
      color: #00fff7;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: .25s ease;
    }
    .splash-btn:hover{
      background: rgba(0, 255, 247, 0.18);
      border-color: rgba(0,255,247,0.5);
    }
    .splash-hint{
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(232,255,255,0.6);
    }
    .splash-hide { display:none; }
    .splash-card--compact{
      padding: 26px 26px 22px;
      max-width: 720px;
    }

    .splash-sub{
      margin: 0 0 14px;
      font-size: 13px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: rgba(232,255,255,0.72);
    }

    .splash-btn--pulse{
      position: relative;
      box-shadow: 0 0 0 rgba(0,255,247,0);
      animation: ctaPulse 1.8s infinite ease-in-out;
    }
    @keyframes ctaPulse{
      0%, 100% { transform: translateY(0); box-shadow: 0 0 0 rgba(0,255,247,0); }
      50%      { transform: translateY(-1px); box-shadow: 0 0 24px rgba(0,255,247,0.18); }
    }

    .splash-clickhint{
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(232,255,255,0.52);
      opacity: 0.9;
    }
  </style>

  <script>
    function $(id){ return document.getElementById(id); }
    function show(id){ const el = $(id); if(el) el.setAttribute('visible', true); }
    function hide(id){ const el = $(id); if(el) el.setAttribute('visible', false); }
    function hideAll(){ hide('tools-card'); hide('focus-card'); }

    let sceneReady = false;
    document.addEventListener('DOMContentLoaded', () => {
      if (AFRAME) {
        document.querySelector('a-scene').addEventListener('loaded', () => {
          sceneReady = true;
          console.log('Scene ready');
        });
      }
    });

    AFRAME.registerComponent('camera-movement', {
      init: function () {
        this.moveSpeed = 0.2;
        this.activeKeys = new Set();
        this.keyMap = {
          'ArrowUp': 'forward',
          'ArrowDown': 'backward',
          'ArrowLeft': 'left',
          'ArrowRight': 'right',
          'w': 'forward',
          's': 'backward',
          'a': 'left',
          'd': 'right'
        };
        document.addEventListener('keydown', (e) => {
          const direction = this.keyMap[e.key];
          if (direction) {
            this.activeKeys.add(direction);
            e.preventDefault();
          }
        });
        document.addEventListener('keyup', (e) => {
          const direction = this.keyMap[e.key];
          if (direction) this.activeKeys.delete(direction);
        });
      },
      tick: function () {
        if (this.activeKeys.size === 0) return;

        const rig = this.el;
        const position = rig.getAttribute('position');

        let moveX = 0;
        let moveZ = 0;
        if (this.activeKeys.has('forward')) moveZ -= 1;
        if (this.activeKeys.has('backward')) moveZ += 1;
        if (this.activeKeys.has('left')) moveX -= 1;
        if (this.activeKeys.has('right')) moveX += 1;

        const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
        if (length > 0) { moveX /= length; moveZ /= length; }

        rig.setAttribute('position', {
          x: position.x + moveX * this.moveSpeed,
          y: position.y,
          z: position.z + moveZ * this.moveSpeed
        });
      }
    });

    /* =========================
       VR HELPERS (reliable clicking + VR-only layout)
       ========================= */

    // VR-only visibility helper
    AFRAME.registerComponent('vr-only', {
      init: function () {
        const scene = this.el.sceneEl;
        const set = (v) => this.el.setAttribute('visible', !!v);
        set(false);
        scene.addEventListener('enter-vr', () => set(true));
        scene.addEventListener('exit-vr', () => set(false));
      }
    });

    // Big invisible hitbox (makes laser clicks MUCH easier)
    AFRAME.registerComponent('big-hit', {
      schema: {
        w: { type: 'number', default: 1.6 },
        h: { type: 'number', default: 1.6 },
        d: { type: 'number', default: 0.25 }
      },
      init: function () {
        const box = document.createElement('a-box');
        box.setAttribute('width', this.data.w);
        box.setAttribute('height', this.data.h);
        box.setAttribute('depth', this.data.d);
        box.setAttribute('material', 'transparent: true; opacity: 0;');
        box.setAttribute('class', 'clickable');
        box.setAttribute('position', '0 0 0');
        this.el.appendChild(box);
      }
    });

    // Hover feedback (so you KNOW when you're aiming correctly)
    AFRAME.registerComponent('hover-glow', {
      init: function () {
        const on = () => this.el.setAttribute('scale', '1.08 1.08 1.08');
        const off = () => this.el.setAttribute('scale', '1 1 1');
        this.el.addEventListener('mouseenter', on);
        this.el.addEventListener('mouseleave', off);
      }
    });

    // VR-only position push (X/Z only)
    AFRAME.registerComponent('vr-push', {
      schema: { dx: { type: 'number', default: 0 }, dz: { type: 'number', default: 0 } },
      init: function () {
        this.sceneEl = this.el.sceneEl;
        this.basePos = null;

        this.onEnter = () => {
          const p = this.el.getAttribute('position') || {x:0,y:0,z:0};
          this.basePos = { x: p.x, y: p.y, z: p.z };
          this.el.setAttribute('position', { x: p.x + this.data.dx, y: p.y, z: p.z + this.data.dz });
        };

        this.onExit = () => { if (this.basePos) this.el.setAttribute('position', this.basePos); };

        this.sceneEl.addEventListener('enter-vr', this.onEnter);
        this.sceneEl.addEventListener('exit-vr', this.onExit);
      },
      remove: function () {
        if (!this.sceneEl) return;
        this.sceneEl.removeEventListener('enter-vr', this.onEnter);
        this.sceneEl.removeEventListener('exit-vr', this.onExit);
      }
    });

    // VR-only ground offset (Y only) - for perceived floor alignment
    AFRAME.registerComponent('vr-ground-offset', {
      schema: { y: { type: 'number', default: -0.12 } },
      init: function () {
        this.sceneEl = this.el.sceneEl;
        this.basePos = null;

        this.onEnter = () => {
          const p = this.el.getAttribute('position') || {x:0,y:0,z:0};
          this.basePos = { x: p.x, y: p.y, z: p.z };
          this.el.setAttribute('position', { x: p.x, y: p.y + this.data.y, z: p.z });
        };

        this.onExit = () => { if (this.basePos) this.el.setAttribute('position', this.basePos); };

        this.sceneEl.addEventListener('enter-vr', this.onEnter);
        this.sceneEl.addEventListener('exit-vr', this.onExit);
      },
      remove: function () {
        if (!this.sceneEl) return;
        this.sceneEl.removeEventListener('enter-vr', this.onEnter);
        this.sceneEl.removeEventListener('exit-vr', this.onExit);
      }
    });

    // VR-Y LIFT COMPONENT (NEW): Lifts specific elements ONLY in VR mode
    AFRAME.registerComponent('vr-y', {
      schema: { dy: { type: 'number', default: 0 } },
      init: function () {
        this.sceneEl = this.el.sceneEl;
        this.baseY = null;
        this.applied = false;

        const lift = () => {
          if (this.applied) return;
          const pos = this.el.getAttribute('position') || {x:0,y:0,z:0};
          this.baseY = pos.y;
          this.el.setAttribute('position', { x: pos.x, y: pos.y + this.data.dy, z: pos.z });
          this.applied = true;
        };

        const reset = () => {
          if (!this.applied || this.baseY === null) return;
          const pos = this.el.getAttribute('position') || {x:0,y:0,z:0};
          this.el.setAttribute('position', { x: pos.x, y: this.baseY, z: pos.z });
          this.applied = false;
        };

        this.sceneEl.addEventListener('enter-vr', lift);
        this.sceneEl.addEventListener('exit-vr', reset);
      },
      remove: function () {
        if (!this.sceneEl) return;
        this.sceneEl.removeEventListener('enter-vr', lift);
        this.sceneEl.removeEventListener('exit-vr', reset);
      }
    });

    // Adjust WORLD height in VR (NOT the rig). Desktop unchanged.
    AFRAME.registerComponent('vr-floor-lock', {
      schema: { targetEyeHeight: { type: 'number', default: 1.6 } },
      init: function () {
        this.sceneEl = this.el.sceneEl;
        this.worldEl = document.getElementById('world');
        this.camEl = document.getElementById('cam');
        this._raf = null;

        this.onEnterVR = () => {
          if (this.camEl) this.camEl.setAttribute('position', {x: 0, y: 0, z: 0});

          cancelAnimationFrame(this._raf);
          this._raf = requestAnimationFrame(() => {
            if (!this.camEl || !this.worldEl) return;

            const hmdY = this.camEl.object3D.position.y || 0;
            const target = this.data.targetEyeHeight;

            let worldY = -(target - hmdY);

            // keep stable
            worldY = Math.max(-0.35, Math.min(0.35, worldY));

            const wp = this.worldEl.getAttribute('position') || {x:0,y:0,z:0};
            this.worldEl.setAttribute('position', { x: wp.x, y: worldY, z: wp.z });
          });
        };

        this.onExitVR = () => {
          cancelAnimationFrame(this._raf);
          if (this.worldEl) {
            const wp = this.worldEl.getAttribute('position') || {x:0,y:0,z:0};
            this.worldEl.setAttribute('position', { x: wp.x, y: 0, z: wp.z });
          }
          if (this.camEl) this.camEl.setAttribute('position', {x: 0, y: 1.6, z: 0});
        };

        this.sceneEl.addEventListener('enter-vr', this.onEnterVR);
        this.sceneEl.addEventListener('exit-vr', this.onExitVR);
      },
      remove: function () {
        cancelAnimationFrame(this._raf);
        if (!this.sceneEl) return;
        this.sceneEl.removeEventListener('enter-vr', this.onEnterVR);
        this.sceneEl.removeEventListener('exit-vr', this.onExitVR);
      }
    });

    // Teleport: supports desktop click + VR triggerdown (much more reliable on Quest/Wolvic)
    AFRAME.registerComponent('teleport-to', {
      schema: { pos: {type: 'vec3'}, rotY: {type: 'number', default: 0} },
      init: function () {
        this.el.classList.add('clickable');

        const handler = () => {
          const rig = document.getElementById('rig');
          const cam = document.getElementById('cam');
          rig.setAttribute('position', {x: this.data.pos.x, y: 0, z: this.data.pos.z});

          if (cam && cam.components['look-controls']) {
            const lc = cam.components['look-controls'];
            if (lc.yawObject) lc.yawObject.rotation.y = THREE.MathUtils.degToRad(this.data.rotY);
          }
          hideAll();
        };

        // Desktop
        this.el.addEventListener('click', handler);
        // VR (Quest/Wolvic)
        this.el.addEventListener('triggerdown', handler);

        // Make children clickable too (VR rays often hit inner geometry)
        const bindChildren = () => {
          const kids = this.el.querySelectorAll('*');
          kids.forEach(k => k.classList && k.classList.add('clickable'));
          kids.forEach(k => {
            k.addEventListener('click', handler);
            k.addEventListener('triggerdown', handler);
          });
        };
        bindChildren();
        this.el.addEventListener('loaded', bindChildren);
      }
    });

    // Thumbstick locomotion (rig on XZ plane)
    AFRAME.registerComponent('thumbstick-locomotion', {
      schema: { speed: { type: 'number', default: 1.35 }, deadzone: { type: 'number', default: 0.12 } },
      init: function () {
        this.axis = { x: 0, y: 0 };
        this.camEl = document.getElementById('cam');
        this.rigEl = this.el;

        const leftHand = document.getElementById('leftHand');
        const rightHand = document.getElementById('rightHand');

        const onMove = (e) => { this.axis.x = e.detail.x || 0; this.axis.y = e.detail.y || 0; };

        if (leftHand) leftHand.addEventListener('thumbstickmoved', onMove);
        if (rightHand) rightHand.addEventListener('thumbstickmoved', onMove);
      },
      tick: function (t, dt) {
        if (!dt) return;

        const ax = this.axis.x;
        const ay = this.axis.y;
        if (Math.abs(ax) < this.data.deadzone && Math.abs(ay) < this.data.deadzone) return;

        const rigPos = this.rigEl.getAttribute('position') || {x:0,y:0,z:0};

        let yaw = 0;
        const cam = this.camEl;
        const lc = cam && cam.components && cam.components['look-controls'];
        if (lc && lc.yawObject) yaw = lc.yawObject.rotation.y;

        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

        const move = new THREE.Vector3().addScaledVector(right, ax).addScaledVector(forward, -ay);
        const len = move.length();
        if (len > 0) move.divideScalar(len);

        const step = (dt / 1000) * this.data.speed;

        this.rigEl.setAttribute('position', { x: rigPos.x + move.x * step, y: 0, z: rigPos.z + move.z * step });
      }
    });

    // Exit: supports desktop click + VR triggerdown
    AFRAME.registerComponent('vr-exit', {
      init: function () {
        this.el.classList.add('clickable');
        const handler = () => {
          const scene = document.querySelector('a-scene');
          if (scene && scene.is('vr-mode')) scene.exitVR();
          showSplash();
        };
        this.el.addEventListener('click', handler);
        this.el.addEventListener('triggerdown', handler);
      }
    });

    // Click-to-action: supports desktop click + VR triggerdown for cards/buttons
    AFRAME.registerComponent('on-triggerdown', {
      schema: { action: { type: 'string' }, param: { type: 'string' } },
      init: function () {
        this.el.classList.add('clickable');
        
        const handler = () => {
          const action = this.data.action;
          const param = this.data.param;
          
          if (action === 'focusImage' && param) {
            focusImage(param);
          } else if (action === 'goToCenter') {
            goToCenter();
          }
        };

        // Desktop
        this.el.addEventListener('click', handler);
        // VR (Quest/Wolvic)
        this.el.addEventListener('triggerdown', handler);

        // Make children clickable too (VR rays often hit inner geometry)
        const bindChildren = () => {
          const kids = this.el.querySelectorAll('*');
          kids.forEach(k => k.classList && k.classList.add('clickable'));
          kids.forEach(k => {
            k.addEventListener('click', handler);
            k.addEventListener('triggerdown', handler);
          });
        };
        bindChildren();
        this.el.addEventListener('loaded', bindChildren);
      }
    });

    AFRAME.registerComponent('billboard', {
      schema: { onlyY: {type: 'boolean', default: false} },
      tick: function () {
        const camera = document.querySelector('[camera]').object3D;
        const obj = this.el.object3D;
        if (!camera || !obj) return;

        if (this.data.onlyY) {
          const cameraPos = camera.getWorldPosition(new THREE.Vector3());
          const objPos = obj.getWorldPosition(new THREE.Vector3());
          const direction = new THREE.Vector3().subVectors(cameraPos, objPos);
          direction.y = 0;
          obj.lookAt(objPos.clone().add(direction));
        } else {
          obj.lookAt(camera.position);
        }
      }
    });

    AFRAME.registerComponent('intro-autorotate', {
      init: function () {
        this.active = true;
        this.timeoutId = null;

        const stop = () => {
          this.active = false;
          if (this.timeoutId) clearTimeout(this.timeoutId);
        };

        window.addEventListener('mousemove', stop, { once: true });
        window.addEventListener('mousedown', stop, { once: true });
        window.addEventListener('keydown', stop, { once: true });

        this.timeoutId = setTimeout(stop, 22000);
      },

      tick: function (time, delta) {
        if (!this.active) return;

        const cam = document.getElementById('cam');
        const lc = cam && cam.components && cam.components['look-controls'];
        if (!lc || !lc.yawObject) return;

        lc.yawObject.rotation.y += delta * 0.00030;
      },

      remove: function() {
        if (this.timeoutId) {
          clearTimeout(this.timeoutId);
          this.timeoutId = null;
        }
        this.active = false;
      }
    });

    function focusImage(assetId){
      const imgPlane = document.getElementById('focus-image');
      const focus = document.getElementById('focus-card');
      if(imgPlane && focus){
        imgPlane.setAttribute('material', `shader: flat; src: #${assetId}; transparent: true;`);
        focus.setAttribute('visible', true);
      }
    }

    function goToCenter() {
      const rig = document.getElementById('rig');
      const cam = document.getElementById('cam');

      rig.setAttribute('position', {x: 0, y: 0, z: 0});

      if (cam && cam.components['look-controls']) {
        const lc = cam.components['look-controls'];
        if (lc.yawObject) lc.yawObject.rotation.y = 0;
      }
      hideAll();
    }

    function hideSplash(){
      const s = document.getElementById('splash');
      if(s) s.classList.add('splash-hide');

      if (sceneReady) {
        const rig = document.getElementById('rig');
        if (rig && !rig.hasAttribute('intro-autorotate')) {
          rig.setAttribute('intro-autorotate', '');
          console.log('Autorotate activated');
        }
      } else {
        document.querySelector('a-scene').addEventListener('loaded', () => {
          const rig = document.getElementById('rig');
          if (rig && !rig.hasAttribute('intro-autorotate')) {
            rig.setAttribute('intro-autorotate', '');
            console.log('Autorotate activated (delayed)');
          }
        });
      }
    }

    function showSplash(){
      const s = document.getElementById('splash');
      if(s) s.classList.remove('splash-hide');

      const rig = document.getElementById('rig');
      if (rig && rig.hasAttribute('intro-autorotate')) {
        rig.removeAttribute('intro-autorotate');
        console.log('Autorotate deactivated');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('enterBtn');
      const splash = document.getElementById('splash');

      const handleEnter = (e) => {
        if (e) e.preventDefault();
        hideSplash();
      };

      btn?.addEventListener('pointerdown', handleEnter);
      btn?.addEventListener('click', handleEnter);

      splash?.addEventListener('click', (e) => {
        if (e.target === splash) handleEnter();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && splash && !splash.classList.contains('splash-hide')) {
          handleEnter();
        }
      });
    });
  </script>
</head>

<body>
  <!-- SPLASH SCREEN -->
  <div id="splash" class="splash">
    <div class="splash-card splash-card--compact">
      <div class="splash-kicker">LIVE PROJECT</div>
      <h1 class="splash-title">Interactive Spatial Experience</h1>
      <p class="splash-sub">Explore this project in a live 3D environment</p>
      <div class="splash-actions">
        <button class="splash-btn splash-btn--pulse" id="enterBtn">Enter Experience</button>
        <div class="splash-hint">WebXR • In-browser • No install</div>
      </div>
      <div class="splash-clickhint">Click "Enter" or press Enter</div>
    </div>
  </div>

  <!-- DESKTOP UI (unchanged) -->
  <div class="topbar">
    <div style="font-weight: bold; color: #00fff7; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 12px; margin-right: 4px;">AIVRSE</div>
    <button class="btn" onclick="showSplash()">Exit</button>
  </div>

  <div class="footer-hint">Use Mouse to look around • Click beacons to teleport • arrows/WASD to move • Space to center</div>

  <a-scene
    renderer="colorManagement: true; antialias: true;"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable"
    vr-mode-ui="enabled: true"
    webxr="referenceSpaceType: local-floor"
  >
    <a-assets>
      <img id="panoLobby" src="imagens/panorama_gallery.jpg" />
      <img id="logoAivrse" src="imagens/logoaiv.png" />
      <img id="aboutaxlara" src="imagens/aboutaxlara_.png" crossorigin="anonymous" />
      <img id="g1" src="imagens/gallery2.png" />
      <img id="g2" src="imagens/gallery3.png" />
      <img id="g3" src="imagens/gallery1.png" />
      <img id="capsule" src="imagens/capsule.png" />
    </a-assets>

    <!-- RIG -->
    <a-entity id="rig"
              position="0 0 0"
              camera-movement
              vr-floor-lock="targetEyeHeight: 1.6"
              thumbstick-locomotion="speed: 1.35; deadzone: 0.12">
      <a-entity id="cam" camera look-controls position="0 1.6 0" fov="80">
        <a-cursor material="color: #00fff7; shader: flat" geometry="primitive: ring; radiusInner: 0.007; radiusOuter: 0.011"></a-cursor>
      </a-entity>

      <!-- VR Controllers (tuned raycaster) -->
      <a-entity id="leftHand"
                laser-controls="hand: left"
                raycaster="objects: .clickable; far: 50; interval: 0"
                cursor="rayOrigin: entity; fuse: false"
                line="opacity: 0.85">
      </a-entity>

      <a-entity id="rightHand"
                laser-controls="hand: right"
                raycaster="objects: .clickable; far: 50; interval: 0"
                cursor="rayOrigin: entity; fuse: false"
                line="opacity: 0.85">
      </a-entity>
    </a-entity>

    <!-- WORLD -->
    <a-entity id="world" position="0 0 0">
      <a-sky src="#panoLobby" rotation="0 -40 0" material="color: #fff; shader: flat; opacity: 0.8"></a-sky>
      <a-entity light="type: ambient; intensity: 1.3;"></a-entity>
      <a-entity light="type: directional; intensity: 0.8; position: 5 10 5"></a-entity>

      <!-- VR-LIFT CONTROLLER (NEW ENTITY) - Controls Y-lift for specific elements in VR -->
      <a-entity id="vr-lift" vr-y="dy: 0.50"></a-entity>

      <!-- VR-only Exit Beacon (BIG hit + hover + triggerdown via vr-exit) -->
      <a-entity id="exit-beacon"
                class="clickable"
                vr-only
                vr-exit
                big-hit="w: 1.1; h: 0.55; d: 0.25"
                hover-glow
                position="2.3 1.25 -1.6"
                billboard="onlyY: true"
                vr-y="dy: 0.50">
        <a-plane width="0.85" height="0.30"
                 material="shader: flat; color: #00161a; opacity: 0.78; transparent: true"></a-plane>
        <a-plane width="0.85" height="0.30"
                 material="shader: flat; color: #00fff7; opacity: 0.10; transparent: true"
                 position="0 0 0.001"></a-plane>
        <a-text value="EXIT" align="center" width="2.8"
                color="#00fff7"
                font="https://cdn.aframe.io/fonts/Roboto-msdf.json  "
                shader="msdf"
                position="0 0 0.01"></a-text>
      </a-entity>

      <!-- Logo principal -->
      <a-entity id="logo-container" position="0 3.85 -4.25" rotation="0 0 0"
                animation="property: position; to: 0 3.95 -4.25; dur: 3000; dir: alternate; loop: true; easing: easeInOutQuad"
                vr-y="dy: 0.50">
        <a-plane width="3.3" height="1.5"
                 material="shader: flat; src: #logoAivrse; transparent: true; opacity: 0.9"
                 billboard="onlyY: true"></a-plane>

        <a-entity position="0 -0.70 0.05" billboard="onlyY: true">
          <a-text value="Welcome to the AIVRSE Spatial Gallery"
                  align="center" width="5.6" color="#000000"
                  font="https://cdn.aframe.io/fonts/Roboto-msdf.json  " shader="msdf"
                  opacity="0.28" position="0.018 -0.018 -0.001"></a-text>

          <a-text value="Welcome to the AIVRSE Spatial Gallery"
                  align="center" width="5.6" color="#086171"
                  font="https://cdn.aframe.io/fonts/Roboto-msdf.json  " shader="msdf"
                  opacity="0.92"></a-text>
        </a-entity>

        <a-entity position="0 -1.15 0.05" billboard="onlyY: true">
          <a-text value="Where immersive dreams take shape, light, and presence"
                  align="center" width="4.6" color="#E8FFFF"
                  font="https://cdn.aframe.io/fonts/Roboto-msdf.json  " shader="msdf"
                  opacity="0.92" lineHeight="58" wrapCount="42"></a-text>
        </a-entity>
      </a-entity>

      <!-- About section -->
      <a-entity id="about-image-fixed"
                position="-5.5 1.5 -0.5"
                vr-push="dx: -0.6; dz: -0.3"
                rotation="0 90 0"
                animation="property: position; to: -5.5 1.6 -0.5; dur: 4000; dir: alternate; loop: true; easing: easeInOutSine">
        <a-plane width="4" height="2.6"
                 material="color: #0b0f12; opacity: 0.62; transparent: true"
                 position="0 0 0.01"></a-plane>
        <a-plane width="3.74" height="2.14"
                 material="shader: flat; color: #00fff7; opacity: 0.08; transparent: true"
                 position="0 0.1 0.015"></a-plane>
        <a-plane width="3.6" height="2"
                 material="shader: flat; color: #000000; opacity: 0.18; transparent: true"
                 position="0.03 0.07 0.016"></a-plane>
        <a-plane id="focus-image" width="3.6" height="2" position="0 0.1 0.02"
                 material="shader: flat; src: #aboutaxlara; opacity: 0.82;"></a-plane>

        <!-- Beacon circular abaixo do about (BIG hit + hover + triggerdown via teleport-to) -->
        <a-entity class="clickable"
                  position="0 -2.5 0"
                  rotation="-90 0 0"
                  big-hit="w: 1.6; h: 1.6; d: 0.35"
                  hover-glow
                  teleport-to="pos: -3.6 0 -0.8; rotY: 90">
          <a-circle radius="0.8" material="shader: flat; color: #00fff7; opacity: 0.1; transparent: true; side: double"></a-circle>
          <a-ring radius-inner="0.6" radius-outer="0.65"
                  material="shader: flat; color: #00fff7; opacity: 0.3; transparent: true; side: double"
                  animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine">
          </a-ring>
          <a-ring radius-inner="0.4" radius-outer="0.45"
                  material="shader: flat; color: #00fff7; opacity: 0.2; transparent: true; side: double"
                  animation="property: scale; from: 1 1 1; to: 0.9 0.9 1; dur: 2500; dir: alternate; loop: true; easing: easeInOutSine; delay: 500">
          </a-ring>
        </a-entity>

        <a-entity position="0 -2 0" billboard="onlyY: true">
          <a-text value="ABOUT" align="center" width="2.2" color="#000000" opacity="0.25"
                  font="https://cdn.aframe.io/fonts/Roboto-msdf.json  " shader="msdf"
                  position="0.012 -0.012 -0.001"></a-text>
          <a-text value="ABOUT" align="center" width="2.2" color="#00fff7" opacity="0.95"
                  font="https://cdn.aframe.io/fonts/Roboto-msdf.json  " shader="msdf"></a-text>
        </a-entity>
      </a-entity>

      <!-- CAPSULE -->
      <a-entity id="capsule-stand"
                position="-1.8 0 3.2"
                vr-ground-offset="y: -0.10"
                vr-push="dx: -0.2; dz: 0.8"
                rotation="0 35 0">
        <a-entity position="0 0.72 0" billboard="onlyY: true">
          <a-plane width="1.75" height="2.15"
                   material="shader: flat; src: #capsule; transparent: true; opacity: 0.98">
          </a-plane>
        </a-entity>
      </a-entity>

      <!-- Beacon para galeria (more VR distance + BIG hit + hover) -->
      <a-entity id="beacon-gallery"
                class="clickable"
                position="6 0 2.6"
                vr-ground-offset="y: -0.12"
                vr-push="dx: 1.6; dz: 1.1"
                big-hit="w: 1.8; h: 1.8; d: 0.35"
                hover-glow
                rotation="0 -100 0"
                teleport-to="pos: 6 0 2.6; rotY: -90">

        <a-entity rotation="-90 0 0">
          <a-circle radius="0.60" material="shader: flat; color: #00fff7; opacity: 0.15; transparent: true"></a-circle>
          <a-ring radius-inner="0.35" radius-outer="0.40"
                  material="shader: flat; color: #00fff7; opacity: 0.5; transparent: true"
                  animation="property: scale; from: 1 1 1; to: 1.15 1.15 1.15; dur: 2000; dir: alternate; loop: true"></a-ring>
        </a-entity>
        <a-text value="EXPLORE WORKS" position="0 0.5 0" align="center" width="2.5" color="#00fff7" billboard="onlyY: true"></a-text>
      </a-entity>

      <!-- Cards (ALL THREE HAVE vr-y="dy: 0.50" + on-triggerdown ADDED) -->
      <a-entity class="clickable"
                position="6.5 1.75 -0.5"
                vr-push="dx: 0.6; dz: -0.3"
                look-at="#cam"
                on-triggerdown="action: focusImage; param: g1"
                animation="property: position; to: 6.5 1.72 -0.5; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine"
                vr-y="dy: 0.50">
        <a-plane width="4" height="2.6" material="color: #0b0f12; opacity: 0.75; transparent: true" position="0 0 0.01"></a-plane>
        <a-plane width="3.6" height="2" position="0 0.1 0.02"
                 material="shader: flat; src: #g1; transparent: true; opacity: 0.95"></a-plane>
        <a-text value="IMMERSIVE EXPERIENCES VR" align="center" position="0 -1.1 0.03" width="3" color="#00fff7" billboard="onlyY: true"></a-text>
      </a-entity>

      <a-entity class="clickable"
                position="8.7 2.10 2.4"
                vr-push="dx: 0.7; dz: 0.5"
                look-at="#cam"
                on-triggerdown="action: focusImage; param: g2"
                animation="property: position; to: 8.7 1.90 2.4; dur: 3500; dir: alternate; loop: true; easing: easeInOutSine"
                vr-y="dy: 0.50">
        <a-plane width="4" height="2.6" material="color: #0b0f12; opacity: 0.75; transparent: true" position="0 0 0.01"></a-plane>
        <a-plane width="3.6" height="2" position="0 0.1 0.02"
                 material="shader: flat; src: #g2; transparent: true; opacity: 0.95"></a-plane>
        <a-text value="AI CREATIVE RESEARCH" align="center" position="0 -1.1 0.03" width="3" color="#00fff7" billboard="onlyY: true"></a-text>
      </a-entity>

      <a-entity class="clickable"
                position="8.7 1.95 7"
                vr-push="dx: 0.7; dz: 0.6"
                look-at="#cam"
                on-triggerdown="action: focusImage; param: g3"
                animation="property: position; to: 8.7 1.80 7; dur: 4000; dir: alternate; loop: true; easing: easeInOutSine"
                vr-y="dy: 0.50">
        <a-plane width="4" height="2.6" material="color: #0b0f12; opacity: 0.75; transparent: true" position="0 0 0.01"></a-plane>
        <a-plane width="3.6" height="2" position="0 0.1 0.02"
                 material="shader: flat; src: #g3; transparent: true; opacity: 0.95"></a-plane>
        <a-text value="SPATIAL / ARCHITECTURE 360°" align="center" position="0 -1.1 0.03" width="3" color="#00fff7" billboard="onlyY: true"></a-text>
      </a-entity>

      <!-- Center (BIG hit + hover + triggerdown) -->
      <a-entity id="teleport-back"
                position="1.5 0 1.5"
                vr-ground-offset="y: -0.12"
                vr-push="dx: 0.7; dz: 0.6"
                big-hit="w: 1.6; h: 1.6; d: 0.35"
                hover-glow
                class="clickable"
                on-triggerdown="action: goToCenter">
        <a-ring radius-inner="0.3" radius-outer="0.35" rotation="-90 0 0"
                material="color: #00fff7; emissive: #00fff7; emissiveIntensity: 2; opacity: 0.4; transparent: true"
                animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dur: 2000; dir: alternate; loop: true">
        </a-ring>
        <a-circle radius="0.5" rotation="-90 0 0"
                  material="color: #00fff7; opacity: 0.05; transparent: true; side: double">
        </a-circle>
        <a-text value="CENTER" position="0 0.5 0" align="center" width="2" color="#E8FFFF" billboard="onlyY: true"></a-text>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideAll();
      if (e.key === ' ') goToCenter();
    });
  </script>
</body>
</html>
