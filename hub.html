<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AIVRSE Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <style>
    html, body { 
      margin:0; 
      height:100%; 
      background:#000; 
      overflow:hidden;
      font-family: Arial, sans-serif;
    }
    
    .topbar {
      position: fixed; 
      top: 10px; 
      left: 10px; 
      z-index: 10;
      display:flex; 
      gap:8px; 
      align-items:center;
      background: rgba(0, 10, 20, 0.8);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 10px;
      padding: 8px 12px;
      color: #E8FFFF;
      font-size: 12px;
      backdrop-filter: blur(5px);
    }
    
    .btn {
      border: 1px solid rgba(0, 255, 255, 0.3);
      background: rgba(0, 30, 60, 0.5);
      color: #E8FFFF;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }
    
    .btn:hover { 
      background: rgba(0, 150, 255, 0.3); 
      border-color: rgba(0, 255, 255, 0.5);
    }
  </style>

  <script>
    function $(id){ return document.getElementById(id); }
    function show(id){ const el = $(id); if(el) el.setAttribute('visible', true); }
    function hide(id){ const el = $(id); if(el) el.setAttribute('visible', false); }
  </script>
</head>

<body>
  <div class="topbar">
    <button class="btn" onclick="window.location.href='hub.html'">← Back</button>
    <span style="font-weight: 600; letter-spacing: .6px;">AIVRSE</span>
  </div>

  <a-scene renderer="colorManagement: true" cursor="rayOrigin: mouse">

    <a-assets>
      <img id="panoLobby" src="imagens/panorama_estudio_360.jpg" />
      <img id="coverStudio" src="imagens/capa_studioax.jpg" />
      <img id="coverWorks" src="imagens/capa_gallery360.png" />
      <img id="axlaraPhoto" src="imagens/axlarasf.png" />
    </a-assets>

    <a-sky src="#panoLobby" rotation="0 50 0"></a-sky>
    
    <!-- leve “film” para unificar o contraste -->
    <a-plane 
      geometry="primitive: sphere; radius: 500" 
      material="color: #000; opacity: 0.25; transparent: true"
      position="0 0 0">
    </a-plane>

    <a-entity id="rig" position="0 0 0">
      <a-entity camera look-controls position="0 1.6 0">
        <a-cursor 
          fuse="false" 
          raycaster="objects: .clickable"
          material="color: #00fff7"
          geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.012">
        </a-cursor>
      </a-entity>
    </a-entity>

 <a-entity id="logo-container" position="0 3.15 -4.25" look-at="#rig">
 

  <a-text value="AIVRSE" align="center" width="9" color="#000" 
    font="exo2bold" letter-spacing="8" position="0.02 0.07 -0.01" opacity="0.9">
  </a-text>

  <a-text value="AIVRSE" align="center" width="8.8" color="#00fff7" 
    font="exo2bold" letter-spacing="8" position="0 0.08 0.01" opacity="0.5">
  </a-text>

  <a-text value="AIVRSE" align="center" width="8.8" color="#C0C0C0" 
    font="exo2bold" letter-spacing="8" position="0 0.08 0.03">
  </a-text>

  <a-text value="Welcome to the AIVRSE Digital Hub" align="center" width="6.5" 
    color="#000" font="dejavu" position="0.005 -0.335 0.01" opacity="0.7">
  </a-text>
  <a-text value="Welcome to the AIVRSE Digital Hub" align="center" width="6.5" 
    color="#E8FFFF" font="dejavu" position="0 -0.33 0.02">
  </a-text>

  <a-text value="Click the markers to navigate" align="center" width="6" 
    color="#000" font="dejavu" position="0.003 -0.553 0.01" opacity="0.6">
  </a-text>
  <a-text value="Click the markers to navigate" align="center" width="6" 
    color="#A0F0F0" font="dejavu" position="0 -0.55 0.02">
  </a-text>
</a-entity>

    <!-- PORTAL 1 (mais “perto da porta” / mais convidativo) -->
    <a-entity id="portal-studio"
      position="-3.05 1.55 -2.55"
      rotation="0 28 0"
      class="clickable"
      onclick="window.location.href='studio360.html'">

      <a-image 
        src="#coverStudio" 
        width="2.1" 
        height="1.2" 
        position="0 0 0">
      </a-image>
      
      <a-plane width="2.2" height="1.3" position="0 0 0.01"
        material="color: #00fff7; opacity: 0.16; transparent: true">
      </a-plane>

      <!-- label + feixe -->
      <a-entity id="text-studio" position="0 -0.92 0.02">
        <a-cone radius-bottom="0.75" radius-top="0.10" height="0.55" 
          position="0 0.12 0" rotation="180 0 0"
          material="color: #00fff7; opacity: 0.18; transparent: true; side: back">
        </a-cone>

<a-text value="ENTER THE STUDIO" align="center" width="2.2" color="#000" position="0.005 0.495 0.009" opacity="0.8"></a-text>
<a-text value="ENTER THE STUDIO" align="center" width="2.2" color="#fff" position="0 0.50 0.01"></a-text>

<a-text value="AIVRSE SPACE" align="center" width="2.0" color="#000" position="0.005 0.295 0.009" opacity="0.8"></a-text>
<a-text value="AIVRSE SPACE" align="center" width="2.0" color="#808080" position="0 0.30 0.01"></a-text>
        </a-text>
      </a-entity>
    </a-entity>

    <!-- PORTAL 2 -->
    <a-entity id="portal-works"
      position="2.85 1.55 -2.75"
      rotation="0 -24 0"
      class="clickable"
      onclick="window.location.href='works.html'">

      <a-image src="#coverWorks" 
        width="2.1" 
        height="1.2" 
        position="0 0 0">
      </a-image>
      
      <a-plane width="2.2" height="1.3" position="0 0 0.01"
        material="color: #00aaff; opacity: 0.16; transparent: true">
      </a-plane>

      <a-entity id="text-works" position="0 -0.92 0.02">
        <a-cone radius-bottom="0.65" radius-top="0.10" height="0.55" 
          position="0 0.18 0" rotation="180 0 0"
          material="color: #00aaff; opacity: 0.18; transparent: true; side: back">
        </a-cone>

<a-text value="VISIT THE XR GALLERY" align="center" width="2.2" color="#000" position="0.005 0.495 0.009" opacity="0.8"></a-text>
<a-text value="VISIT THE XR GALLERY" align="center" width="2.2" color="#fff" position="0 0.50 0.01"></a-text>

<a-text value="PROJECTS / EXPERIMENTS" align="center" width="2.0" color="#000" position="0.005 0.295 0.009" opacity="0.8"></a-text>
<a-text value="PROJECTS / EXPERIMENTS" align="center" width="2.0" color="#808080" position="0 0.30 0.01"></a-text>
        </a-text>
      </a-entity>
    </a-entity>

    <!-- ABOUT (ponto no chão = wayfinding) -->
    <a-entity id="about-area" position="0 0 -2.0">

      <a-cone radius-bottom="0.6" radius-top="0.1" height="0.8" 
        position="0 0.75 0" rotation="180 0 0"
        material="color: #00fff7; opacity: 0.14; transparent: true; side: back"
        animation="property: material.opacity; from: 0.10; to: 0.20; dur: 2000; loop: true; dir: alternate">
      </a-cone>
      
      <a-circle radius="0.7" position="0 0.01 0" rotation="-90 0 0"
        material="color: #00fff7; opacity: 0.28; transparent: true; emissive: #00fff7; emissiveIntensity: 0.5"
        animation="property: material.opacity; from: 0.18; to: 0.38; dur: 2000; loop: true; dir: alternate; delay: 250">
      </a-circle>

      <a-entity id="text-about" position="0 0.92 0" look-at="#rig">
<a-text value="ABOUT AIVRSE" align="center" width="1.8" color="#000" position="0.005 0.055 0.009" opacity="0.8"></a-text>
<a-text value="ABOUT AIVRSE" align="center" width="1.8" color="#E8FFFF" position="0 0.06 0.01"></a-text>

<a-text value="(press to open)" align="center" width="1.6" color="#000" position="0.003 -0.103 0.009" opacity="0.6"></a-text>
<a-text value="(press to open)" align="center" width="1.6" color="#808080" position="0 -0.10 0.01"></a-text>

      </a-entity>

      <a-entity id="about-spot"
        position="0 0.05 0"
        rotation="-90 0 0"
        class="clickable"
        onclick="show('about-card')">

        <a-circle radius="0.2"
          material="color: #00fff7; opacity: 0.38; transparent: true; emissive: #00fff7; emissiveIntensity: 0.55"
          animation="property: scale; from: 0.9 0.9 0.9; to: 1.12 1.12 1.12; dur: 2000; loop: true; dir: alternate">
        </a-circle>
      </a-entity>
    </a-entity>

    <!-- ABOUT CARD -->
    <a-entity id="about-card" visible="false" position="0 1.7 -2.0" look-at="#rig">

      <a-plane width="3.0" height="1.8"
        material="color: #001a33; opacity: 0.9; transparent: true">
      </a-plane>

      <a-plane width="3.1" height="1.9" position="0 0 0.01"
        material="color: #00fff7; opacity: 0.16; transparent: true">
      </a-plane>

      <a-image src="#axlaraPhoto" 
        position="-1.0 0.2 0.02" 
        width="0.9" 
        height="0.9">
      </a-image>
      
      <a-entity position="0.2 0.6 0.02"
        text="value: AXLARA; align: left; width: 3; color: #FFFFFF; font: dejavu;">
      </a-entity>

      <a-entity position="0.2 0.3 0.02"
        text="value: XR Developer & AI Artist; align: left; width: 3; color: #A0F0F0; font: dejavu;">
      </a-entity>

      <a-entity position="0.2 0.0 0.02"
        text="value: Building spatial interfaces for presence.; align: left; width: 3; color: #80E0E0; font: dejavu;">
      </a-entity>

      <a-entity position="1.3 0.7 0.02" class="clickable"
        geometry="primitive: plane; width: 0.5; height: 0.3"
        material="color:#00fff7; opacity:0.18; transparent:true"
        onclick="hide('about-card')">
        <a-entity position="0 0 0.01"
          text="value: X; align: center; color: #FFFFFF; font: dejavu;">
        </a-entity>
      </a-entity>

      <a-entity position="0 -0.6 0.02" class="clickable"
        geometry="primitive: plane; width: 1.2; height: 0.4"
        material="color: #00fff7; opacity: 0.18; transparent: true"
        onclick="window.location.href='about.html'">
        <a-entity position="0 0 0.01"
          text="value: OPEN ABOUT; align: center; color: #FFFFFF; font: dejavu;">
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- ILUMINAÇÃO -->
    <a-light type="ambient" color="#001a33" intensity="0.42"></a-light>
    <a-light type="directional" color="#00aaff" intensity="0.5" position="-2 3 -4"></a-light>
    <a-light type="directional" color="#00aaff" intensity="0.5" position="2 3 -4"></a-light>
    
    <!-- Luzes extras -->
    <a-light type="point" color="#00fff7" intensity="0.30" position="-3.0 0.6 -2.6" distance="4.5"></a-light>
    <a-light type="point" color="#00aaff" intensity="0.30" position="2.9 0.6 -2.8" distance="4.5"></a-light>
    <a-light type="point" color="#00fff7" intensity="0.40" position="0 1.0 -2.0" distance="5"></a-light>
    <a-light type="point" color="#00aaff" intensity="0.45" position="0 2.5 -4.0" distance="6"></a-light>

  </a-scene>

 <script>
document.addEventListener('DOMContentLoaded', function () {

  // Fechar about com ESC
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      const card = document.getElementById('about-card');
      if (card) card.setAttribute('visible', false);
    }
  });

});
</script>

</body>
</html>
