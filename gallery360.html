<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AIVRSE Hub | Professional Immersive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
  <!-- Importando aframe-extras para movement-controls -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family: 'Segoe UI', sans-serif; }
    .topbar { position: fixed; top: 15px; left: 15px; z-index: 10; display:flex; gap:12px; align-items:center; background: rgba(10, 20, 25, 0.75); border: 1px solid rgba(0, 255, 247, 0.3); border-radius: 12px; padding: 10px 16px; color: #E8FFFF; font-size: 13px; backdrop-filter: blur(12px); }
    .btn { border: 1px solid rgba(0, 255, 247, 0.2); background: rgba(255, 255, 255, 0.05); color: #00fff7; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; }
    .btn:hover { background: rgba(0, 255, 247, 0.15); border-color: #00fff7; }
    
    /* Indicador sutil no rodapé */
    .footer-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(159, 236, 236, 0.6);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      pointer-events: none;
      animation: pulse 3s infinite ease-in-out;
      z-index: 10;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
    
    /* Controles de ajuda */
    .controls-hint {
      position: fixed;
      bottom: 40px;
      left: 15px;
      color: rgba(159, 236, 236, 0.7);
      font-size: 11px;
      background: rgba(10, 20, 25, 0.6);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(0, 255, 247, 0.2);
      z-index: 10;
    }
  </style>

  <script>
    function $(id){ return document.getElementById(id); }
    function show(id){ const el = $(id); if(el) el.setAttribute('visible', true); }
    function hide(id){ const el = $(id); if(el) el.setAttribute('visible', false); }
    function hideAll(){ hide('tools-card'); hide('focus-card'); }

    // Componente para seguir o mouse sutilmente (Efeito Paralaxe)
    AFRAME.registerComponent('mouse-tilt', {
      init: function () {
        this.el.originalRotation = this.el.getAttribute('rotation');
        window.addEventListener('mousemove', (e) => {
          let cx = (e.clientX / window.innerWidth - 0.5) * 5; // limite de 5 graus
          let cy = (e.clientY / window.innerHeight - 0.5) * 5;
          this.el.setAttribute('rotation', {
            x: this.el.originalRotation.x - cy,
            y: this.el.originalRotation.y + cx,
            z: this.el.originalRotation.z
          });
        });
      }
    });

    // Componente para teleporte mantido - funciona normalmente com movement-controls
    AFRAME.registerComponent('teleport-to', {
      schema: { pos: {type: 'vec3'}, rotY: {type: 'number', default: 0} },
      init: function () {
        this.el.classList.add('clickable');
        this.el.addEventListener('click', (evt) => {
          evt.stopPropagation(); // Previne interferência com outros eventos
          const rig = document.getElementById('rig');
          const cam = document.getElementById('cam');
          
          // Teleporta o rig para a nova posição
          rig.setAttribute('position', this.data.pos);
          
          // Ajusta a rotação da câmera se necessário
          if (cam && cam.components['look-controls']) {
            const lc = cam.components['look-controls'];
            if (lc.yawObject) {
              lc.yawObject.rotation.y = THREE.MathUtils.degToRad(this.data.rotY);
            }
          }
          
          hideAll();
        });
      }
    });

    function focusImage(assetId){
      const imgPlane = document.getElementById('focus-image');
      const focus = document.getElementById('focus-card');
      if(imgPlane && focus){
        imgPlane.setAttribute('material', `shader: flat; src: #${assetId}; transparent: true;`);
        focus.setAttribute('visible', true);
      }
    }
    
    // Função para voltar ao centro (space ou clique no beacon center)
    function goToCenter() {
      const rig = document.getElementById('rig');
      const cam = document.getElementById('cam');
      
      rig.setAttribute('position', {x: 0, y: 0, z: 0});
      
      if (cam && cam.components['look-controls']) {
        const lc = cam.components['look-controls'];
        if (lc.yawObject) {
          lc.yawObject.rotation.y = 0;
        }
      }
      
      hideAll();
    }
  </script>
</head>

<body>
  <div class="topbar">
    <div style="font-weight: bold; color: #00fff7; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 12px; margin-right: 4px;">AIVRSE</div>
    <button class="btn" onclick="window.location.href='index.html'">Exit</button>
    <button class="btn" onclick="show('tools-card')">Tools</button>
  </div>

  <div class="footer-hint">Use mouse to look around • Click on beacons to teleport</div>
  <div class="controls-hint">Move: WASD/Arrows • Jump: Space • Run: Hold Shift • Center: C or click CENTER beacon</div>

  <a-scene renderer="colorManagement: true; antialias: true;" cursor="rayOrigin: mouse">
    <a-assets>
      <img id="panoLobby" src="imagens/panorama_gallery.jpg" />
      <img id="logoAivrse" src="imagens/logoaiv.png" />
      <img id="aboutaxlara" src="imagens/aboutaxlara_.png" crossorigin="anonymous" />
      <img id="g1" src="imagens/gallery3.png" />
      <img id="g2" src="imagens/gallery2.png" />
      <img id="g3" src="imagens/gallery1.png" />
    </a-assets>

    <!-- Sky com opacidade normal -->
    <a-sky src="#panoLobby" rotation="0 -40 0" material="color: #fff; shader: flat; opacity: 0.9"></a-sky>
    <a-entity light="type: ambient; intensity: 1.3;"></a-entity>
    <a-entity light="type: directional; intensity: 0.8; position: 5 10 5"></a-entity>

    <!-- RIG com movement-controls para navegação livre WASD/setas -->
    <a-entity id="rig" 
              position="0 1.6 0"
              movement-controls="speed: 0.2; fly: true; constrainToNavMesh: false; camera: #cam"
              kinematic-body="radius: 0.5; height: 1.6">
      
      <!-- Câmera com look-controls dentro do rig -->
      <a-entity id="cam" 
                camera="active: true; fov: 80" 
                look-controls="pointerLockEnabled: false; reverseMouseDrag: true"
                position="0 0 0">
        <a-cursor material="color: #00fff7; shader: flat" 
                  geometry="primitive: ring; radiusInner: 0.007; radiusOuter: 0.011"
                  raycaster="objects: .clickable"></a-cursor>
      </a-entity>
    </a-entity>

    <!-- Logo principal com efeito parallax -->
    <a-entity id="logo-container" position="0 3.85 -4.25" look-at="#cam" mouse-tilt
              animation="property: position; to: 0 3.95 -4.25; dur: 3000; dir: alternate; loop: true; easing: easeInOutQuad">
      <a-plane width="2.3" height="0.95" material="shader: flat; src: #logoAivrse; transparent: true; opacity: 0.9"></a-plane>
      <a-text value="Welcome to the AIVRSE Digital Hub" align="center" width="5.5" 
              position="0 -0.68 0.05"
              material="shader: flat; color: linear-gradient(to bottom, #00fff7, #09616c);">
      </a-text>
      <a-text value="fast, lightweight, in-browser"
        align="center" width="5.6" 
        position="0 -0.94 0.05" wrapCount="58" lineHeight="56"
        material="shader: flat; color: linear-gradient(to bottom, #D3D3D3, #7a7a7a);">
      </a-text>
    </a-entity>

    <!-- About section com beacon circular -->
    <a-entity id="about-image-fixed" position="-4.5 1.5 -0.5" rotation="0 90 0" look-at="#cam" mouse-tilt
              animation="property: position; to: -4.5 1.6 -0.5; dur: 4000; dir: alternate; loop: true; easing: easeInOutSine">
      <a-plane width="4" height="2.6" material="color: #050a0c; opacity: 0.15; transparent: true"></a-plane>
      <a-plane id="focus-image" width="3.6" height="2" position="0 0.1 0.02" 
               material="shader: flat; src: #aboutaxlara; opacity: 0.9;"></a-plane>
      
      <!-- Beacon circular abaixo do about -->
      <a-entity position="0 -2.5 0" rotation="-90 0 0">
        <a-circle radius="0.8" material="shader: flat; color: #00fff7; opacity: 0.1; transparent: true; side: double"></a-circle>
        <a-ring radius-inner="0.6" radius-outer="0.65" 
                material="shader: flat; color: #00fff7; opacity: 0.3; transparent: true; side: double"
                animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine">
        </a-ring>
        <a-ring radius-inner="0.4" radius-outer="0.45"
                material="shader: flat; color: #00fff7; opacity: 0.2; transparent: true; side: double"
                animation="property: scale; from: 1 1 1; to: 0.9 0.9 1; dur: 2500; dir: alternate; loop: true; easing: easeInOutSine; delay: 500">
        </a-ring>
      </a-entity>
    </a-entity>

    <!-- Beacon para galeria -->
    <a-entity id="beacon-gallery" position="5 0 2" rotation="0 -100 0" teleport-to="pos: 5 0 2; rotY: -90" class="clickable">
      <a-entity rotation="-90 0 0">
        <a-circle radius="0.60" material="shader: flat; color: #00fff7; opacity: 0.15; transparent: true"></a-circle>
        <a-ring radius-inner="0.35" radius-outer="0.40" material="shader: flat; color: #00fff7; opacity: 0.5; transparent: true"
                animation="property: scale; from: 1 1 1; to: 1.15 1.15 1.15; dur: 2000; dir: alternate; loop: true"></a-ring>
      </a-entity>
      <a-text value="EXPLORE WORKS" position="0 0.5 0" align="center" width="2.5" color="#00fff7" look-at="#rig"></a-text>
    </a-entity>

    <!-- Cards da galeria -->
    <a-entity class="clickable" position="6.5 1.65 -0.5" look-at="#cam" onclick="focusImage('g1')"
              animation="property: position; to: 6.5 1.72 -0.5; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine">
      <a-plane width="4" height="2.6" material="color: #0b0f12; opacity: 0.75; transparent: true"></a-plane>
      <a-plane width="3.6" height="2" position="0 0.1 0.02"
               material="shader: flat; src: #g2; transparent: true; opacity: 0.95"
               gallery-crop="repeat: 1.65 1.20; offset: 0.10 0.08"></a-plane>
      <a-text value="IMMERSIVE EXPERIENCES VR" align="center" position="0 -1.1 0.03" width="3" color="#00fff7"></a-text>
    </a-entity>

    <a-entity class="clickable" position="8.7 1.65 2.4" look-at="#cam" onclick="focusImage('g2')"
              animation="property: position; to: 8.7 1.58 2.4; dur: 3500; dir: alternate; loop: true; easing: easeInOutSine">
      <a-plane width="4" height="2.6" material="color: #0b0f12; opacity: 0.75; transparent: true"></a-plane>
      <a-plane width="3.6" height="2" position="0 0.1 0.02"
               material="shader: flat; src: #g1; transparent: true; opacity: 0.95"
               gallery-crop="repeat: 2 1.5; offset: -1 -1"></a-plane>
      <a-text value="AI CREATIVE RESEARCH" align="center" position="0 -1.1 0.03" width="3" color="#00fff7"></a-text>
    </a-entity>
    
    <a-entity class="clickable" position="8.7 1.65 7" look-at="#cam" onclick="focusImage('g3')"
              animation="property: position; to: 8.7 1.70 7; dur: 4000; dir: alternate; loop: true; easing: easeInOutSine">
      <a-plane width="4" height="2.6" material="color: #0b0f12; opacity: 0.75; transparent: true"></a-plane>
      <a-plane width="3.6" height="2" position="0 0.1 0.02"
               material="shader: flat; src: #g3; transparent: true; opacity: 0.95"
               gallery-crop="repeat: 1.60 1.15; offset: 0.14 0.10"></a-plane>
      <a-text value="SPATIAL / ARCHITECTURE 360°" align="center" position="0 -1.1 0.03" width="3" color="#00fff7"></a-text>
    </a-entity>

    <!-- Beacon central para voltar ao centro -->
    <a-entity id="teleport-back" position="1.5 0 1.5" class="clickable" onclick="goToCenter()">
      <a-ring radius-inner="0.3" radius-outer="0.35" rotation="-90 0 0" 
              material="color: #00fff7; emissive: #00fff7; emissiveIntensity: 2; opacity: 0.4; transparent: true"
              animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dur: 2000; dir: alternate; loop: true">
      </a-ring>
      <a-circle radius="0.5" rotation="-90 0 0" 
                material="color: #00fff7; opacity: 0.05; transparent: true; side: double">
      </a-circle>
      <a-text value="CENTER" position="0 0.5 0" align="center" width="2" color="#E8FFFF" look-at="#rig"></a-text>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener('keydown', (e) => { 
      if (e.key === 'Escape') hideAll();
      if (e.key === 'c' || e.key === 'C') goToCenter();
    });
    
    // Configuração adicional para movement-controls
    document.addEventListener('DOMContentLoaded', () => {
      console.log('A-Frame com movement-controls carregado!');
      console.log('Use WASD/Arrow keys para mover, Space para pular, Shift para correr');
    });
  </script>
</body>
</html>
